# 本地开发用的数据库服务
# 用法：
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down

services:
  postgres:
    image: postgres:18-alpine
    container_name: vitransfer-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitransfer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitransfer}
      POSTGRES_DB: ${POSTGRES_DB:-vitransfer}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - vitransfer-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitransfer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: vitransfer-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-vitransfer}
    ports:
      - "6379:6379"
    volumes:
      - vitransfer-redis-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-vitransfer}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vitransfer-postgres-dev:
  vitransfer-redis-dev:
