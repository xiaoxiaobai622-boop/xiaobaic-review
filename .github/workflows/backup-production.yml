name: Backup production before server cancellation

on:
  workflow_dispatch:

concurrency:
  group: production-backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    name: Export encrypted production backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Export and encrypt on production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            backup_dir=/tmp/xiaobaic-server-backup
            rm -rf "$backup_dir"
            mkdir -p "$backup_dir/plain"
            cd /opt/vitransfer/vitransfer-test

            docker exec vitransfer-postgres sh -c \
              'pg_dump --clean --if-exists --no-owner --no-privileges -U "$POSTGRES_USER" "$POSTGRES_DB"' \
              > "$backup_dir/plain/database.sql"

            cp .env docker-compose.yml Caddyfile "$backup_dir/plain/"
            docker inspect vitransfer-app vitransfer-postgres vitransfer-redis \
              > "$backup_dir/plain/docker-inspect.json"
            docker volume ls > "$backup_dir/plain/docker-volumes.txt"
            docker exec vitransfer-app sh -c \
              'printf "STORAGE_PROVIDER=%s\nS3_ENDPOINT=%s\nS3_BUCKET=%s\nS3_REGION=%s\n" \
              "$STORAGE_PROVIDER" "$S3_ENDPOINT" "$S3_BUCKET" "$S3_REGION"' \
              > "$backup_dir/plain/storage-location.txt"

            tar -C "$backup_dir/plain" -czf "$backup_dir/backup.tar.gz" .
            openssl rand -hex 32 > "$backup_dir/archive-password.txt"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in "$backup_dir/backup.tar.gz" \
              -out "$backup_dir/xiaobaic-server-backup.tar.gz.enc" \
              -pass file:"$backup_dir/archive-password.txt"

            cat > "$backup_dir/recovery-public.pem" <<'PUBLIC_KEY'
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAz7ygfYkKIIpjR/4QNa6Z
            0zpv2WgFiyaxeBuy3UOl9fkMAknkNfom3bf3MPsj5Tv5JgKP3SL04ZL+EjmfYcVK
            iE1RWSEf7qdaEM/FYkWdtUpk0RaKILuLPen9OZtsHL4mgYEm/zkCpicDmdfFqLUn
            n9ZvNDc3haMca92TUBzzA041THj1Hgzf6r/xfmWHLU0/zW2LG8np2RKH1TCOxtyo
            CYOn5/VsjVSxNC090OaT6ilQoP8tgUV9//HlzmAspf7wnVlxOFa3tSGwVTOuODMh
            S75cRNuNOoJ2Oe0CoRqlTwmlK2AdoASF+nWyQe3yk1n7ajzHrC5VDkF6tL62kK/P
            uRArJj/DAc8ZdrA5mmMoJTD5D0ZneKv2FOzOhza73tbCl8iyuxk6KNaVJzCYyHKZ
            sQ3dAMjmIP+0EQgSucGEI3x0Rs4cTughlJjWjr9FiyXCAwLxrRf09hiA0c5sJa/F
            Dg3aIwSd9wcNd3PIcG5VJ3f7qp8FyECx2iWwCg8vy0bzAgMBAAE=
            -----END PUBLIC KEY-----
            PUBLIC_KEY

            openssl pkeyutl -encrypt -pubin \
              -inkey "$backup_dir/recovery-public.pem" \
              -in "$backup_dir/archive-password.txt" \
              -out "$backup_dir/archive-password.key.enc" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256

            sha256sum "$backup_dir/xiaobaic-server-backup.tar.gz.enc" \
              "$backup_dir/archive-password.key.enc" \
              > "$backup_dir/SHA256SUMS.txt"
            rm -rf "$backup_dir/plain" "$backup_dir/backup.tar.gz" \
              "$backup_dir/archive-password.txt" "$backup_dir/recovery-public.pem"

      - name: Download encrypted backup from server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: /tmp/xiaobaic-server-backup/*
          target: backup-artifacts
          strip_components: 2

      - name: Verify encrypted backup
        run: |
          cd backup-artifacts
          sha256sum -c SHA256SUMS.txt
          test -s xiaobaic-server-backup.tar.gz.enc
          test -s archive-password.key.enc

      - name: Store encrypted backup in private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="server-backup-${GITHUB_RUN_ID}"
          gh release create "$tag" backup-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Encrypted server backup $(date -u +%F)" \
            --notes "Encrypted PostgreSQL and server configuration backup created before server cancellation. The recovery private key is stored only on the owner's computer. OSS media objects are not duplicated in this release."

      - name: Remove temporary server backup
        if: always()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: rm -rf /tmp/xiaobaic-server-backup

