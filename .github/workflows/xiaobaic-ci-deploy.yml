name: Xiaobaic CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production application
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PHASE: phase-production-build
        run: npm run build

  image:
    name: Build private image
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image-ref
        shell: bash
        run: echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image-ref.outputs.image }}:${{ github.sha }}
            ${{ steps.image-ref.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy with health check and rollback
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: 12m
          script: |
            set -eu
            cd /opt/vitransfer/vitransfer-test

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$DEPLOY_IMAGE"

            rollback_tag="vitransfer-local:rollback-${{ github.sha }}"
            docker tag vitransfer-local:zh "$rollback_tag"
            docker tag "$DEPLOY_IMAGE" vitransfer-local:zh

            rollback() {
              trap - ERR
              echo "Deployment health check failed; restoring $rollback_tag"
              docker tag "$rollback_tag" vitransfer-local:zh
              docker compose up -d --no-deps --force-recreate app worker
            }
            trap rollback ERR

            docker compose up -d --no-deps --force-recreate app worker

            for attempt in $(seq 1 36); do
              app_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' vitransfer-app 2>/dev/null || true)
              worker_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' vitransfer-worker 2>/dev/null || true)
              echo "Health check $attempt: app=$app_status worker=$worker_status"
              if [ "$app_status" = healthy ] && [ "$worker_status" = healthy ]; then
                trap - ERR
                curl --fail --silent --show-error https://xiaobaic.cn/api/health
                docker logout ghcr.io
                echo "Deployment completed successfully"
                exit 0
              fi
              sleep 5
            done

            false
