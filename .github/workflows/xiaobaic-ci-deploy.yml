name: Xiaobaic CI and Manual Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment to the production website
        required: true
        type: boolean
        default: false

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production application
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PHASE: phase-production-build
        run: npm run build

  image:
    name: Build and push production image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image-ref
        shell: bash
        run: echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-ref.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            SKIP_NPM_AUDIT=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://mle6.cn
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_PROXY_SUBSCRIPTION: ${{ secrets.GHCR_PROXY_SUBSCRIPTION }}
    steps:
      - name: Pull through Germany proxy and deploy with rollback
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_SHA,DEPLOY_IMAGE,GHCR_USERNAME,GHCR_TOKEN,GHCR_PROXY_SUBSCRIPTION
          command_timeout: 35m
          script: |
            set -eu

            case "$DEPLOY_SHA" in
              ''|*[!0-9a-f]*) echo "Invalid deployment SHA"; exit 1 ;;
            esac
            if [ "${#DEPLOY_SHA}" -ne 40 ]; then
              echo "Invalid deployment SHA length"
              exit 1
            fi

            expected_image="ghcr.io/xiaoxiaobai622-boop/xiaobaic-review:$DEPLOY_SHA"
            if [ "$DEPLOY_IMAGE" != "$expected_image" ]; then
              echo "Unexpected deployment image: $DEPLOY_IMAGE"
              exit 1
            fi

            app_dir=/opt/vitransfer/vitransfer-test
            live_tag=vitransfer-mps:fast
            rollback_tag="vitransfer-mps:rollback-$DEPLOY_SHA"
            image_tar="/tmp/xiaobaic-review-$DEPLOY_SHA.tar"
            auth_dir="/tmp/xiaobaic-review-ghcr-auth-$DEPLOY_SHA"
            env_backup="/tmp/xiaobaic-review-env-$DEPLOY_SHA"
            target_mps_template_id=1796772

            cd "$app_dir"
            docker image inspect "$live_tag" >/dev/null
            cleanup() {
              sudo rm -f "$image_tar"
              sudo rm -rf "$auth_dir"
              sudo rm -f "$env_backup"
            }
            trap cleanup EXIT
            cleanup
            sudo mkdir -p "$auth_dir"
            printf '%s\n' "$GHCR_TOKEN" | sudo DOCKER_CONFIG="$auth_dir" /usr/local/bin/crane auth login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            if [ -z "${GHCR_PROXY_SUBSCRIPTION:-}" ]; then
              echo "GHCR_PROXY_SUBSCRIPTION is not configured"
              exit 1
            fi
            proxy_config=/etc/sing-box/ghcr-hk.json
            proxy_subscription=$(mktemp)
            proxy_decoded=$(mktemp)
            proxy_config_candidate=$(mktemp)
            trap 'sudo rm -f "$proxy_subscription" "$proxy_decoded" "$proxy_config_candidate" "$image_tar"; sudo rm -rf "$auth_dir"; sudo rm -f "$env_backup"' EXIT
            curl --fail --silent --show-error "$GHCR_PROXY_SUBSCRIPTION" -o "$proxy_subscription"
            base64 -d "$proxy_subscription" > "$proxy_decoded"
            # The subscription labels are percent-encoded; its first VLESS entry is Germany optimized 01.
            germany_uri=$(grep -m1 '^vless://' "$proxy_decoded" || true)
            if [ -z "$germany_uri" ]; then
              echo "No Germany VLESS node found in subscription"
              exit 1
            fi
            germany_uri="${germany_uri%%#*}"
            germany_authority="${germany_uri#vless://}"
            germany_uuid="${germany_authority%%@*}"
            germany_endpoint="${germany_authority#*@}"
            germany_hostport="${germany_endpoint%%\?*}"
            germany_server="${germany_hostport%%:*}"
            germany_port="${germany_hostport##*:}"
            germany_query="${germany_uri#*\?}"
            get_query_value() {
              printf '%s\n' "$germany_query" | tr '&' '\n' | sed -n "s/^$1=//p" | head -n 1
            }
            germany_sni=$(get_query_value sni)
            germany_public_key=$(get_query_value pbk)
            germany_short_id=$(get_query_value sid)
            germany_flow=$(get_query_value flow)
            germany_fingerprint=$(get_query_value fp)
            if [ -z "$germany_server" ] || [ -z "$germany_uuid" ] || [ -z "$germany_sni" ] || [ -z "$germany_public_key" ]; then
              echo "Germany VLESS node is missing required Reality fields"
              exit 1
            fi
            tee "$proxy_config_candidate" >/dev/null <<EOF
            {
              "log": {"level": "warn"},
              "inbounds": [{"type": "mixed", "listen": "127.0.0.1", "listen_port": 17890}],
              "outbounds": [
                {
                  "type": "vless",
                  "tag": "germany",
                  "server": "$germany_server",
                  "server_port": $germany_port,
                  "uuid": "$germany_uuid",
                  "flow": "$germany_flow",
                  "tls": {
                    "enabled": true,
                    "server_name": "$germany_sni",
                    "utls": {"enabled": true, "fingerprint": "$germany_fingerprint"},
                    "reality": {"enabled": true, "public_key": "$germany_public_key", "short_id": "$germany_short_id"}
                  }
                },
                {"type": "direct", "tag": "direct"}
              ],
              "route": {"final": "germany"}
            }
            EOF
            sudo /usr/local/bin/sing-box check -c "$proxy_config_candidate"
            sudo install -m 600 "$proxy_config_candidate" "$proxy_config"
            sudo systemctl restart sing-box-ghcr
            proxy_ready=0
            for proxy_attempt in $(seq 1 12); do
              proxy_status=$(curl --proxy http://127.0.0.1:17890 --silent --show-error --output /tmp/ghcr-proxy-check-$DEPLOY_SHA.txt --write-out '%{http_code}' https://ghcr.io/v2/ 2>/tmp/ghcr-proxy-error-$DEPLOY_SHA.txt || true)
              if [ "$proxy_status" = 200 ] || [ "$proxy_status" = 401 ]; then
                proxy_ready=1
                break
              fi
              sleep 2
            done
            if [ "$proxy_ready" -ne 1 ]; then
              echo "GHCR proxy did not become ready"
              sudo systemctl status sing-box-ghcr --no-pager || true
              sudo journalctl -u sing-box-ghcr -n 80 --no-pager || true
              cat /tmp/ghcr-proxy-error-$DEPLOY_SHA.txt || true
              exit 1
            fi
            pull_succeeded=0
            for pull_attempt in $(seq 1 3); do
              sudo rm -f "$image_tar"
              echo "GHCR pull attempt $pull_attempt/3"
              if timeout 20m sudo DOCKER_CONFIG="$auth_dir" /usr/local/bin/ghcr-pull "$DEPLOY_IMAGE" "$image_tar"; then
                pull_succeeded=1
                break
              fi
              echo "GHCR pull attempt $pull_attempt failed; retrying after a clean proxy restart"
              sudo systemctl restart sing-box-ghcr
              sleep 3
            done
            if [ "$pull_succeeded" -ne 1 ]; then
              echo "GHCR image pull failed after 3 attempts"
              exit 1
            fi
            sudo docker load -i "$image_tar"
            docker image inspect "$DEPLOY_IMAGE" >/dev/null

            docker tag "$live_tag" "$rollback_tag"
            cp .env "$env_backup"
            rollback() {
              trap - ERR
              echo "Deployment health check failed; restoring $rollback_tag"
              cp "$env_backup" .env
              docker tag "$rollback_tag" "$live_tag"
              docker compose up -d --no-deps --force-recreate app worker
            }
            trap rollback ERR

            if grep -q '^TENCENT_MPS_TEMPLATE_ID=' .env; then
              sed -i "s/^TENCENT_MPS_TEMPLATE_ID=.*/TENCENT_MPS_TEMPLATE_ID=$target_mps_template_id/" .env
            else
              printf '\nTENCENT_MPS_TEMPLATE_ID=%s\n' "$target_mps_template_id" >> .env
            fi
            docker tag "$DEPLOY_IMAGE" "$live_tag"
            deployed_image_id=$(docker image inspect -f '{{.Id}}' "$live_tag")
            docker compose up -d --no-deps --force-recreate app worker

            healthy_streak=0
            for attempt in $(seq 1 48); do
              app_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' vitransfer-app 2>/dev/null || true)
              worker_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' vitransfer-worker 2>/dev/null || true)
              worker_restart_count=$(docker inspect -f '{{.RestartCount}}' vitransfer-worker 2>/dev/null || echo 1)
              app_image_id=$(docker inspect -f '{{.Image}}' vitransfer-app 2>/dev/null || true)
              worker_image_id=$(docker inspect -f '{{.Image}}' vitransfer-worker 2>/dev/null || true)
              worker_template_id=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' vitransfer-worker 2>/dev/null | sed -n 's/^TENCENT_MPS_TEMPLATE_ID=//p' || true)
              echo "Health check $attempt: app=$app_status worker=$worker_status worker_restarts=$worker_restart_count stable=$healthy_streak/6"
              if [ "$app_status" = healthy ] && \
                 [ "$worker_status" = healthy ] && \
                 [ "$worker_restart_count" = 0 ] && \
                 [ "$worker_template_id" = "$target_mps_template_id" ] && \
                 [ "$app_image_id" = "$deployed_image_id" ] && \
                 [ "$worker_image_id" = "$deployed_image_id" ]; then
                healthy_streak=$((healthy_streak + 1))
                if [ "$healthy_streak" -ge 6 ]; then
                  curl --fail --silent --show-error https://mle6.cn/api/health
                  trap - ERR
                  echo "Deployment completed successfully after 30 seconds stable: $DEPLOY_IMAGE"
                  exit 0
                fi
              else
                healthy_streak=0
              fi
              sleep 5
            done

            false
