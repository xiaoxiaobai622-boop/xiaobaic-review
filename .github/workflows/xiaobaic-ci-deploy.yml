name: Xiaobaic CI and Manual Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment to the production website
        required: true
        type: boolean
        default: false

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build production application
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PHASE: phase-production-build
        run: npm run build

  image:
    name: Build and push production image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image-ref
        shell: bash
        run: echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-ref.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            SKIP_NPM_AUDIT=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://mle6.cn
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_PROXY_SUBSCRIPTION: ${{ secrets.GHCR_PROXY_SUBSCRIPTION }}
      TENCENT_MPS_TEMPLATE_ID: ${{ secrets.TENCENT_MPS_TEMPLATE_ID }}
    steps:
      - name: Validate deployment SSH secret
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$DEPLOY_HOST" = "111.229.35.33" ] || { echo "SERVER_HOST must be 111.229.35.33"; exit 1; }
          [ "$DEPLOY_USER" = "root" ] || { echo "SERVER_USER must be root"; exit 1; }
          key_file="$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          public_key=$(ssh-keygen -y -f "$key_file")
          fingerprint=$(printf '%s\n' "$public_key" | ssh-keygen -lf - | awk '{print $2}')
          echo "SSH key format: valid"
          echo "SSH key fingerprint: $fingerprint"
          if [ "$fingerprint" != "SHA256:Xq+fgduRGim2Ca3n17FIsWdFyzStzg5jeN+oJQRqhK8" ]; then
            echo "SERVER_SSH_KEY is not the production deployment key (vitransfer_codex)"
            exit 1
          fi

      - name: Pull through Germany proxy and deploy with rollback
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_SHA,DEPLOY_IMAGE,GHCR_USERNAME,GHCR_TOKEN,GHCR_PROXY_SUBSCRIPTION,TENCENT_MPS_TEMPLATE_ID
          command_timeout: 35m
          script: |
            set -eu
            trap 'status=$?; echo "Deploy script failed at line $LINENO (exit $status): $BASH_COMMAND" >&2; exit $status' ERR

            case "$DEPLOY_SHA" in
              ''|*[!0-9a-f]*) echo "Invalid deployment SHA"; exit 1 ;;
            esac
            if [ "${#DEPLOY_SHA}" -ne 40 ]; then
              echo "Invalid deployment SHA length"
              exit 1
            fi

            expected_image="ghcr.io/xiaoxiaobai622-boop/xiaobaic-review:$DEPLOY_SHA"
            if [ "$DEPLOY_IMAGE" != "$expected_image" ]; then
              echo "Unexpected deployment image: $DEPLOY_IMAGE"
              exit 1
            fi

            app_dir=/opt/vitransfer/vitransfer-test
            live_tag=vitransfer-mps:fast
            rollback_tag="vitransfer-mps:rollback-$DEPLOY_SHA"
            image_tar="/tmp/xiaobaic-review-$DEPLOY_SHA.tar"
            auth_dir="/tmp/xiaobaic-review-ghcr-auth-$DEPLOY_SHA"
            env_backup="/tmp/xiaobaic-review-env-$DEPLOY_SHA"
            puller="/tmp/xiaobaic-layer-pull-$DEPLOY_SHA.sh"
            pull_work="/tmp/ghcr-layer-work-$DEPLOY_SHA"
            diag_log="/tmp/xiaobaic-deploy-diag-$DEPLOY_SHA.log"
            target_mps_template_id="$TENCENT_MPS_TEMPLATE_ID"

            if [ -z "$target_mps_template_id" ]; then
              echo "TENCENT_MPS_TEMPLATE_ID is not configured"
              exit 1
            fi

            cd "$app_dir"
            echo "Deploy phase: server and live image check"
            docker image inspect "$live_tag" >/dev/null
            cleanup() {
              sudo rm -f "$image_tar"
              sudo rm -rf "$auth_dir"
              sudo rm -f "$env_backup"
            }
            trap cleanup EXIT
            cleanup
            sudo mkdir -p "$auth_dir"
            echo "Deploy phase: GHCR credential setup"
            printf '%s\n' "$GHCR_TOKEN" | sudo DOCKER_CONFIG="$auth_dir" /usr/local/bin/crane auth login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            echo "Deploy phase: proxy node selection"
            proxy_config=/etc/sing-box/ghcr-hk.json
            proxy_backup=$(mktemp)
            trap 'sudo systemctl stop sing-box-ghcr >/dev/null 2>&1 || true; sudo rm -f "$proxy_backup" "$image_tar" "$puller"; sudo rm -rf "$auth_dir" "$pull_work"; sudo rm -f "$env_backup"' EXIT
            sudo cp "$proxy_config" "$proxy_backup"
            # The subscription hands out a fresh random set of Cloudflare fronting IPs on every
            # fetch, and on 2026-09-30 the spread measured inside one minute ran from 13 KB/s to
            # 3.7 MB/s. Reaching ghcr.io is therefore not a usable criterion: the server-side picker
            # ranks candidates by how many bytes crane actually moved, re-draws when none clears the
            # bar, and keeps the node already on disk when that one is faster. It pulls with the same
            # credentials and platform as the deployment below, so it measures the real image.
            proxy_ready=0
            if sudo env GHCR_PROXY_IMAGE="$DEPLOY_IMAGE" GHCR_PROXY_AUTH_DIR="$auth_dir" \
                 /usr/local/bin/ghcr-proxy-pick.sh; then
              proxy_ready=1
            fi
            if [ "$proxy_ready" -ne 1 ]; then
              echo "GHCR proxy did not become ready"
              sudo systemctl status sing-box-ghcr --no-pager || true
              sudo journalctl -u sing-box-ghcr -n 80 --no-pager || true
              cat /tmp/ghcr-proxy-error-$DEPLOY_SHA.txt || true
              echo "Trying the server's preconfigured GHCR proxy"
              sudo install -m 600 "$proxy_backup" "$proxy_config"
              sudo systemctl restart sing-box-ghcr
              for proxy_attempt in $(seq 1 12); do
                proxy_status=$(curl --proxy http://127.0.0.1:17890 --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors --output /tmp/ghcr-proxy-fallback-$DEPLOY_SHA.txt --write-out '%{http_code}' https://ghcr.io/v2/ 2>/tmp/ghcr-proxy-fallback-error-$DEPLOY_SHA.txt || true)
                if [ "$proxy_status" = 200 ] || [ "$proxy_status" = 401 ]; then
                  proxy_ready=1
                  break
                fi
                sleep 2
              done
              if [ "$proxy_ready" -ne 1 ]; then
                echo "GHCR proxy did not become ready with subscription or preconfigured proxy"
                cat /tmp/ghcr-proxy-fallback-error-$DEPLOY_SHA.txt || true
                sudo systemctl stop sing-box-ghcr >/dev/null 2>&1 || true
              fi
            fi
            echo "Deploy phase: GHCR image pull"
            pull_succeeded=0
            if [ "$proxy_ready" -eq 1 ]; then
              proxy_url=http://127.0.0.1:17890
            else
              # No proxy is reachable at all. Pull without one: ghcr.io answers from this
              # server directly, so a dead node only costs speed, never the deployment.
              proxy_url=
              echo "Pulling GHCR without a proxy"
            fi
            # crane moves the whole archive over a single connection. This server's only route to
            # ghcr.io is a Cloudflare Worker fronting that was measured (2026-09-30) severing
            # in-flight connections at random: 172,943,872 bytes in, 'unexpected EOF', nothing in the
            # proxy log. Betting 525 MB on one connection is a lottery that retrying does not win.
            # So fetch one blob per connection and resume each blob from the bytes already on disk.
            # No connection gets a time or rate cap; it runs as long as it keeps delivering data,
            # and only a closed connection triggers a reconnect.
            cat > "$puller" <<'PULLER'
            #!/usr/bin/env bash
            # 逐层断点续传拉取 GHCR 镜像，产出 docker load 可用的 tar。
            # 连接只要还在出数据就一直跑，不设任何时长/速率上限；对端掐断后从已落地字节继续。
            set -uo pipefail

            ref="${1:?usage: ghcr-layer-pull.sh <image-ref> <output-tar>}"
            out="${2:?usage: ghcr-layer-pull.sh <image-ref> <output-tar>}"

            host="ghcr.io"
            path_tag="${ref#"$host"/}"
            tag="${path_tag##*:}"
            repo="${path_tag%:*}"
            auth_dir="${GHCR_PULL_DOCKER_CONFIG:-$HOME/.docker}"
            if [ -n "${GHCR_PULL_WORK:-}" ]; then
              work="$GHCR_PULL_WORK"
              mkdir -p "$work"
              cleanup() { :; }
            else
              work="$(mktemp -d /tmp/ghcr-layer-pull.XXXXXX)"
              cleanup() { rm -rf "$work"; }
            fi
            trap cleanup EXIT

            b64auth="$(jq -r --arg h "$host" '.auths[$h].auth // empty' "$auth_dir/config.json" 2>/dev/null)"
            auth_args=()
            if [ -n "$b64auth" ]; then auth_args=(-H "Authorization: Basic $b64auth"); fi

            token="$(curl -fsS "${auth_args[@]}" "https://$host/token?service=$host&scope=repository:$repo:pull" | jq -r '.token // empty')"
            if [ -z "$token" ]; then
              echo "ERROR: no pull token for $repo" >&2
              exit 1
            fi
            bear=(-H "Authorization: Bearer $token")

            acc='Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
            mkdir -p "$work/oci/blobs/sha256"

            curl -fsS "${bear[@]}" -H "$acc" "https://$host/v2/$repo/manifests/$tag" -o "$work/index.json" || { echo "ERROR: manifest fetch failed" >&2; exit 1; }

            child="$(jq -r '[.manifests[]? | select(.platform.os=="linux" and .platform.architecture=="amd64" and ((.platform.variant // "v8")=="v8"))][0].digest // empty' "$work/index.json")"
            if [ -n "$child" ]; then
              curl -fsS "${bear[@]}" -H "$acc" "https://$host/v2/$repo/manifests/$child" -o "$work/manifest.json" || { echo "ERROR: child manifest fetch failed" >&2; exit 1; }
            else
              cp "$work/index.json" "$work/manifest.json"
            fi

            config_dgst="$(jq -r '.config.digest' "$work/manifest.json")"
            jq -r '.layers[] | "\(.digest) \(.size)"' "$work/manifest.json" > "$work/layers.txt"

            total_bytes="$(awk '{s+=$2} END {print s}' "$work/layers.txt")"
            config_size="$(jq -r '.config.size' "$work/manifest.json")"
            echo "pull plan: $(wc -l < "$work/layers.txt") layers + config, ${total_bytes} + ${config_size} bytes"

            fetch_blob() {
              local dgst="$1" want="$2" dst="$3"
              local hex="${dgst#sha256:}"
              local stall=0 have prev rc=0 tries=0
              while :; do
                have="$(stat -c %s "$dst" 2>/dev/null || echo 0)"
                if [ "$have" -ge "$want" ]; then break; fi
                rc=0
                if [ "$have" -gt 0 ]; then
                  echo "  resume $hex from $have/$want ($(( tries + 1 ))th try)"
                  curl -fsSL -C "$have" "${bear[@]}" -o "$dst" "https://$host/v2/$repo/blobs/$dgst" || rc=$?
                else
                  curl -fsSL "${bear[@]}" -o "$dst" "https://$host/v2/$repo/blobs/$dgst" || rc=$?
                fi
                tries=$(( tries + 1 ))
                have="$(stat -c %s "$dst" 2>/dev/null || echo 0)"
                if [ "$have" -le "${prev:--1}" ]; then
                  stall=$(( stall + 1 ))
                  if [ "$stall" -ge 5 ]; then
                    echo "ERROR: $hex delivered no new bytes on $stall consecutive connections ($have/$want)" >&2
                    return 1
                  fi
                  echo "  connection closed early (curl rc=${rc:-0}), $have/$want landed; reconnecting"
                  sleep 2
                else
                  stall=0
                fi
                prev="$have"
              done
              local got
              got="$(sha256sum "$dst" | cut -d' ' -f1)"
              if [ "$got" != "$hex" ]; then
                echo "ERROR: digest mismatch for $hex (got $got), re-downloading from scratch" >&2
                rm -f "$dst"
                fetch_blob "$dgst" "$want" "$dst" && return 0 || return 1
              fi
              return 0
            }

            confhex="${config_dgst#sha256:}"

            if ! fetch_blob "$config_dgst" "$config_size" "$work/oci/$confhex.json"; then exit 1; fi

            n=0
            while read -r dgst size; do
              n=$(( n + 1 ))
              echo "[$n] layer ${dgst#sha256:} ($size bytes)"
              if ! fetch_blob "$dgst" "$size" "$work/oci/blobs/sha256/${dgst#sha256:}"; then exit 1; fi
            done < "$work/layers.txt"

            jq -n --arg cfg "$confhex" --arg ref "$ref" --slurpfile m "$work/manifest.json" \
              '[{Config: ($cfg + ".json"), RepoTags: [$ref], Layers: ($m[0].layers | map("blobs/sha256/" + (.digest | sub("^sha256:"; ""))))}]' \
              > "$work/oci/manifest.json" || { echo "ERROR: manifest.json build failed" >&2; exit 1; }

            tar -cf "$out" -C "$work/oci" . || { echo "ERROR: tar assembly failed" >&2; exit 1; }
            echo "assembled $out ($(stat -c %s "$out") bytes)"
            PULLER
            sudo chmod 755 "$puller"
            for pull_attempt in $(seq 1 5); do
              echo "GHCR pull attempt $pull_attempt: one connection per layer, resuming from disk"
              if sudo env \
                GHCR_PULL_DOCKER_CONFIG="$auth_dir" \
                GHCR_PULL_WORK="$pull_work" \
                HTTP_PROXY="$proxy_url" HTTPS_PROXY="$proxy_url" ALL_PROXY="$proxy_url" \
                http_proxy="$proxy_url" https_proxy="$proxy_url" all_proxy="$proxy_url" \
                bash "$puller" "$DEPLOY_IMAGE" "$image_tar"; then
                pull_succeeded=1
                break
              fi
              echo "GHCR pull attempt $pull_attempt failed; $(sudo du -sb "$pull_work" 2>/dev/null | cut -f1) bytes are already on disk and will be reused"
              if [ "$proxy_ready" -eq 1 ]; then
                sudo systemctl restart sing-box-ghcr
              fi
              sleep 3
            done
            if [ "$pull_succeeded" -ne 1 ]; then
              echo "GHCR image pull failed after 5 attempts"
              exit 1
            fi
            echo "Deploy phase: Docker load and application restart"
            sudo systemctl stop sing-box-ghcr >/dev/null 2>&1 || true
            sudo docker load -i "$image_tar"
            docker image inspect "$DEPLOY_IMAGE" >/dev/null

            docker tag "$live_tag" "$rollback_tag"
            cp .env "$env_backup"
            rollback() {
              trap - ERR
              echo "Deployment health check failed; restoring $rollback_tag"
              {
                echo "===== deploy diagnostics $DEPLOY_SHA ====="
                date -u
                docker inspect -f '{{.Name}} exit={{.State.ExitCode}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}} {{json .State.Health.Log}}{{else}}none{{end}}' vitransfer-app vitransfer-worker || true
                for failed_container in vitransfer-worker vitransfer-app; do
                  echo "----- docker logs $failed_container -----"
                  docker logs --tail 200 "$failed_container" 2>&1 || true
                done
              } >> "$diag_log" 2>&1 || true
              echo "Deploy diagnostics written on server: $diag_log"
              cp "$env_backup" .env
              docker tag "$rollback_tag" "$live_tag"
              docker compose up -d --no-deps --force-recreate app worker
            }
            trap rollback ERR

            if grep -q '^TENCENT_MPS_TEMPLATE_ID=' .env; then
              sed -i "s/^TENCENT_MPS_TEMPLATE_ID=.*/TENCENT_MPS_TEMPLATE_ID=$target_mps_template_id/" .env
            else
              printf '\nTENCENT_MPS_TEMPLATE_ID=%s\n' "$target_mps_template_id" >> .env
            fi
            docker tag "$DEPLOY_IMAGE" "$live_tag"
            deployed_image_id=$(docker image inspect -f '{{.Id}}' "$live_tag")
            : > "$diag_log"
            docker compose up -d --no-deps --force-recreate app worker

            healthy_streak=0
            for attempt in $(seq 1 48); do
              app_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' vitransfer-app 2>/dev/null || true)
              worker_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' vitransfer-worker 2>/dev/null || true)
              worker_restart_count=$(docker inspect -f '{{.RestartCount}}' vitransfer-worker 2>/dev/null || echo 1)
              app_image_id=$(docker inspect -f '{{.Image}}' vitransfer-app 2>/dev/null || true)
              worker_image_id=$(docker inspect -f '{{.Image}}' vitransfer-worker 2>/dev/null || true)
              worker_template_id=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' vitransfer-worker 2>/dev/null | sed -n 's/^TENCENT_MPS_TEMPLATE_ID=//p' || true)
              echo "Health check $attempt: app=$app_status worker=$worker_status worker_restarts=$worker_restart_count stable=$healthy_streak/6" | tee -a "$diag_log"
              if [ "$app_status" = healthy ] && \
                 [ "$worker_status" = healthy ] && \
                 [ "$worker_restart_count" = 0 ] && \
                 [ "$worker_template_id" = "$target_mps_template_id" ] && \
                 [ "$app_image_id" = "$deployed_image_id" ] && \
                 [ "$worker_image_id" = "$deployed_image_id" ]; then
                healthy_streak=$((healthy_streak + 1))
                if [ "$healthy_streak" -ge 6 ]; then
                  curl --fail --silent --show-error https://mle6.cn/api/health
                  trap - ERR
                  echo "Deployment completed successfully after 30 seconds stable: $DEPLOY_IMAGE"
                  exit 0
                fi
              else
                healthy_streak=0
              fi
              sleep 5
            done

            false
